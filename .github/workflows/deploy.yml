name: Deploy Application

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup SSH Key
      uses: webfactory/ssh-agent@v0.5.6
      with:
        ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

    - name: Add Remote Host to Known Hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

    - name: Sync files to VPS
      run: |
        remote_path="${{ secrets.VPS_PATH }}"
        remote_user="${{ secrets.VPS_USER }}"
        remote_host="${{ secrets.VPS_HOST }}"

        ssh "${remote_user}@${remote_host}" "mkdir -p ${remote_path}"
        rsync -avz --delete --exclude='.git' --exclude='node_modules' --exclude='.env' ./ "${remote_user}@${remote_host}:${remote_path}/"
        ssh "${remote_user}@${remote_host}" "cd ${remote_path} && docker compose down 2>/dev/null || true && docker compose up -d --build"

        echo "Deployment completed successfully."
