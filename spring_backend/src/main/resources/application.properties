# H2 in-memory database for local runs. Override these values with environment variables in real environments.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:umatdb;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.defer-datasource-initialization=true

server.port=${SERVER_PORT:8080}

# JWT settings
app.jwt.secret=${APP_JWT_SECRET:replace-with-a-32-byte-or-longer-secret}
app.jwt.expirationMs=${APP_JWT_EXPIRATIONMS:86400000}

# CORS
app.cors.allowedOrigins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080}

# Razorpay
razorpay.key=${RAZORPAY_KEY:}
razorpay.secret=${RAZORPAY_SECRET:}

# Actuator endpoints
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
